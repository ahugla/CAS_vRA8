apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voteapp
  name: vote-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-frontend
  template:
    metadata:
      labels:
        app: vote-frontend
    spec:
      containers:
        - name: vote-frontend
          #image: harbor.yourdomain.com/voteapp/vote-app-frontend:v1.0
          image: harbor.yourdomain.com/voteapp/vote-app-frontend@sha256:28f0ecff2f295373ffc7d73b8c2da8704f33cab6b372e25780ab4b6b6dd90ec4
          ports:
            - containerPort: 80
          env:
            - name: REDIS
              value: lb-vm-redis