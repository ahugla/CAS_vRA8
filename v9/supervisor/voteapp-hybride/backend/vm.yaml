apiVersion: vmoperator.vmware.com/v1alpha3
kind: VirtualMachine
metadata:
  namespace: svc-argocd-service-u3cph
  name: vm-redis
  labels:
    vm-selector: vm-redis
    lb-vm-redis: vm-lb-selector
spec:
  className: best-effort-small
  imageName: vmi-132dbd33bb2a92adb
  storageClass: cluster-wld01-01a-vsan-storage-policy
  powerState: PoweredOn
  #powerState: PoweredOff
  network:
    domainName: mydomain.fr
    nameservers:
      - 8.8.8.8
  bootstrap:
    cloudInit:
      rawCloudConfig:
        name: vm-redis-bootstrap-secret2
        key: user-data
